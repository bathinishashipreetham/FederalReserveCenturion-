<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in
<link rel="canonical" href="https://federalreservecenturion-afr.vercel.app/">
<meta property="og:url" content="https://federalreservecenturion-afr.vercel.app/">
<meta property="og:site_name" content="Centurion">
</title>
<style>
  :root{
    --bg:#EDE6D6;
    --background-image: url("./afr/images/sso-f17v2-bgimg.jpg");	
    --panel:#FAFAF8;
    --ink:#1F2421;
    --muted:#6B6F6B;
    --line:#D8D4CA;
    --accent:#2F4538;
    --accent-ink:#F1EFEA;
    --link:#0572CE;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141815;
      --panel:#1B211C;
      --ink:#ECEAE3;
      --muted:#9A9F97;
      --line:#2C332D;
      --accent:#7FA98C;
      --accent-ink:#10140F;
      --link:#5AA9E6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141815;
    --panel:#1B211C;
    --ink:#ECEAE3;
    --muted:#9A9F97;
    --line:#2C332D;
    --accent:#7FA98C;
    --accent-ink:#10140F;
    --link:#5AA9E6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    padding-top:calc(32px + env(safe-area-inset-top,0px));
    padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  }
  .wrap{
    width:100%;
    max-width:500px;
  }
  .mark{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:28px;
  }
  .mark .glyph{
    width:28px;height:28px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    position:relative;
    flex:none;
  }
  .mark .glyph::after{
    content:"";
    position:absolute;
    left:50%;top:50%;
    width:9px;height:9px;
    background:var(--accent);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .mark span{
    font-size:15px;
    letter-spacing:.04em;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px 36px;
  }
  h1{
    margin:0 0 20px;
    font-size:26px;
    font-weight:700;
    line-height:1.2;
    text-align:center;
  }
  .sub{
    margin:0 0 30px;
    font-size:14.5px;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    margin-bottom:6px;
  }
  .field{margin-bottom:14px;}
  .field input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    padding:8px 2px;
    outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus{
    border-bottom-color:var(--accent);
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:4px 0 26px;
    font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .row label.check{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    cursor:pointer;
  }
  .row input[type=checkbox]{
    accent-color:var(--accent);
    width:14px;height:14px;
  }
  a{
    color:var(--link);
    text-decoration:none;
  }
  a:hover{text-decoration:underline;}
  button{
    width:100%;
    padding:13px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:8px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.9;}
  button:focus-visible, a:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .forgot{
    margin:16px 0 0;
    text-align:center;
    font-size:13.5px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .foot{
    margin-top:24px;
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .legal{
    margin-top:40px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .legal a{color:var(--muted);}
  .panel--secondary{
    margin-top:20px;
    padding:28px 36px;
    text-align:center;
  }
  .secondary-title{
    margin:0 0 16px;
    font-size:17px;
    font-weight:500;
  }
  .ghost-btn{
    display:block;
    width:100%;
    padding:12px;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    font-weight:600;
    text-decoration:none;
    transition:border-color .15s ease;
  }
  .ghost-btn:hover{
    border-color:var(--accent);
    text-decoration:none;
  }
.error-message {
    display: none;
    width: 100%;
    padding: 18px 10px;
    margin-bottom: 14px;
    border: 1px solid #ff453a;
    background: #fff8f7;
    color: #d93025;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 400;
    box-sizing: border-box;
}

.error-message.show {
    display: block;
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>
  Sign in to
  <a href="https://federalreservecenturion.netlify.app/"
     style="color:inherit;text-decoration:none;">
    Centurion
  </a>
</h1>
<form id="loginForm">
    <!-- Warning message -->
    <div id="errorMessage" class="error-message" role="alert">
        Invalid username or password.
    </div>

    <div class="field">
        <label for="email">Email</label>
        <input
            id="email"
            type="email"
            autocomplete="username"
            required
        >
    </div>

    <div class="field">
        <label for="pass">Password</label>
        <input
            id="pass"
            type="password"
            autocomplete="current-password"
            required
        >
    </div>

    <button type="submit">Sign in</button>

    <p class="forgot">
        <a href="forgot-username.html">Forgot Username?</a>
    </p>
</form>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const errorMessage = document.getElementById("errorMessage");

        errorMessage.classList.add("show");
    });
</script>
    </div>
    <div class="panel panel--secondary">
      <p class="secondary-title">Don't have a Centurion Account?</p>
      <a class="ghost-btn" href="#">Create an account</a>
    </div>
    <p class="legal">© Centurion &nbsp;|&nbsp; <a href="#">Terms of Use</a> &nbsp;|&nbsp; <a href="#">Privacy Policy</a></p>
  </div>
</body>
</html>
