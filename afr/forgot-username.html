<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password</title>
<style>
  :root{
    --bg:#EDE6D6;
    --panel:#FAFAF8;
    --ink:#1F2421;
    --muted:#6B6F6B;
    --line:#D8D4CA;
    --accent:#2F4538;
    --accent-ink:#F1EFEA;
    --link:#0572CE;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141815;
      --panel:#1B211C;
      --ink:#ECEAE3;
      --muted:#9A9F97;
      --line:#2C332D;
      --accent:#7FA98C;
      --accent-ink:#10140F;
      --link:#5AA9E6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141815;
    --panel:#1B211C;
    --ink:#ECEAE3;
    --muted:#9A9F97;
    --line:#2C332D;
    --accent:#7FA98C;
    --accent-ink:#10140F;
    --link:#5AA9E6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    padding-top:calc(32px + env(safe-area-inset-top,0px));
    padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  }
  .wrap{
    width:100%;
    max-width:500px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px; /* ← this rounds the card's corners */
    padding:36px;
  }
  h1{
    margin:0 0 16px;
    font-size:26px;
    font-weight:500;
    line-height:1.2;
    text-align:center;
  }
  .sub{
    margin:0 0 28px;
    font-size:14.5px;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    text-align:center;
    line-height:1.5;
  }
  .field{margin-bottom:22px;}
  .field input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    padding:8px 2px;
    outline:none;
    text-align:center;
    transition:border-color .15s ease;
  }
  .field input::placeholder{color:var(--muted);}
  .field input:focus{border-bottom-color:var(--accent);}
  button{
    width:100%;
    padding:13px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:8px; /* ← this rounds the card's corners */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.9;}
  button:focus-visible, a:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  a{color:var(--link); text-decoration:none;}
  a:hover{text-decoration:underline;}
  .help{
    margin-top:24px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Forgot Your Username ?</h1>
      <p class="sub">Enter the email address used when you registered. We'll send your username.</p>
      <form onsubmit="event.preventDefault()">
        <div class="field">
          <input type="email" placeholder="-Enter your email address-" autocomplete="email" required>
        </div>
        <button type="submit">Submit</button>
      </form>
<p class="help">
        <a href="#">Account help</a> &nbsp;|&nbsp; <a href="#">Subscriptions</a> &nbsp;|&nbsp; <a href="#">Unsubscribe</a> &nbsp;|&nbsp; <a href="#">Privacy/Do Not Sell My Info</a> &nbsp;|&nbsp; <a href="#">Cookie preferences</a>
      </p>
    </div>
  </div>
</body>
</html>
