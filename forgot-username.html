<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Your Username? | Centurion</title>
<link rel="canonical" href="https://federalreservecenturion.netlify.app/forgot-username.html">
<meta property="og:url" content="https://federalreservecenturion.netlify.app/forgot-username.html">
<meta property="og:site_name" content="Centurion">
<style>
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --text: #14213d;
    --muted: #5b6678;
    --line: #c5ccd8;
    --accent: #1d3f8a;
    --accent-hover: #15306b;
    --error: #b3261e;
    --ok: #1b6b3a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1422;
      --card: #172036;
      --text: #e8ecf5;
      --muted: #9aa6bd;
      --line: #3a4560;
      --accent: #7fa2f0;
      --accent-hover: #a3bcf6;
      --error: #f2928c;
      --ok: #7fd3a0;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 10px;
    padding: 40px 36px 36px;
    box-shadow: 0 1px 3px rgba(20, 33, 61, .12);
  }
  .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--accent);
    margin: 0 0 20px;
  }
  .brand a { color: inherit; text-decoration: none; }
  .brand a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 12px;
    line-height: 1.25;
  }
  .intro {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 15px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
  }
  input::placeholder { color: var(--muted); }
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  input[aria-invalid="true"] { border-color: var(--error); }
  .message {
    font-size: 14px;
    margin: 6px 0 20px;
    min-height: 21px;
  }
  .message.error { color: var(--error); }
  .message.ok { color: var(--ok); }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 11px 28px;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0e1422; } }
  button:hover { background: var(--accent-hover); }
  button:focus-visible, .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 3px;
  }
  .back {
    display: inline-block;
    margin-top: 24px;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .back:hover { color: var(--accent-hover); text-decoration: underline; }
  footer {
    width: 100%;
    max-width: 560px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  footer nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    row-gap: 6px;
  }
  footer a {
    color: var(--muted);
    text-decoration: none;
    padding: 0 12px;
    border-left: 1px solid var(--line);
  }
  footer a:first-child { border-left: 0; }
  footer a:hover { text-decoration: underline; }
  @media (max-width: 440px) { .card { padding: 32px 22px 28px; } }
</style>
</head>
<body>
  <main class="card">
    <p class="brand"><a href="https://federalreservecenturion.netlify.app/">CENTURION</a></p>
    <h1>Forgot Your Username?</h1>
    <p class="intro">Enter the email address used when you registered. We’ll send your username.</p>

    <form id="forgot" novalidate>
      <label class="sr-only" for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" autofocus aria-describedby="email-message">
      <p class="message" id="email-message" role="alert"></p>
      <button type="submit">Submit</button>
    </form>

    <a class="back" href="index.html">Back to sign in</a>
  </main>

  <footer>
    <nav aria-label="Footer">
      <a href="#account-help">Account Help</a>
      <a href="#subscriptions">Subscriptions</a>
      <a href="#unsubscribe">Unsubscribe</a>
      <a href="#privacy">Privacy / Do Not Sell My Info</a>
      <a href="#cookies">Cookie Preferences</a>
    </nav>
  </footer>

<script>
  var form = document.getElementById("forgot");
  var input = document.getElementById("email");
  var message = document.getElementById("email-message");

  function show(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var value = input.value.trim();
    var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    if (!valid) {
      input.setAttribute("aria-invalid", "true");
      show(value ? "Enter a valid email address." : "Enter your email address.", "error");
      input.focus();
      return;
    }
    input.removeAttribute("aria-invalid");
    fetch("/api/forgot-username", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: value })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (r.ok) {
          show(r.data.message, "ok");
        } else {
          show(r.data.error || "Something went wrong. Try again.", "error");
        }
      })
      .catch(function () {
        show("Can’t reach the server. Check your connection and try again.", "error");
      });
  });

  input.addEventListener("input", function () {
    input.removeAttribute("aria-invalid");
    show("", "");
  });
</script>
</body>
</html>
